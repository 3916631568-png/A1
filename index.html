<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>观赏站点</title>
    <link rel="icon" type="image/jpeg" href="https://img.tuiguang09.cn/20260320/card/23.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="https://img.tuiguang09.cn/20260320/card/23.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1a1a22;
            background-image: url('https://img.tuiguang09.cn/20260320/card/21.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: scroll;
            min-height: 100vh;
            color: #ffffff;
            padding: 20px 15px;
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }
        html { background: #1a1a22; }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://th.bing.com/th/id/OIP.-lfiLU0SedCHTbLCGwVERgAAAA?w=160&h=349&c=7&r=0&o=7&pid=1.7&rm=3');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }
        .cover-box img {
            width:100%;
            display:block;
            object-fit:cover;
        }
        .user-info{
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:30px;
        }
        .avatar{
            width:64px;
            height:64px;
            border-radius:50%;
            overflow:hidden;
            border:2px solid #4488ff;
        }
        .avatar img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .username{
            font-size:19px;
            font-weight:bold;
        }
        .card-wrap{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:36px;
            margin-bottom:10px;
        }
        .card-item{
            background:#272733;
            border-radius:12px;
            padding:22px 8px;
            text-align:center;
            border:1px solid #383848;
        }
        .card-item a{
            color:#B5A642;
            text-decoration:none;
            font-size:16px;
            display:block;
        }
        .card-item:hover{
            border-color:#4488ff;
        }
        .footer-tip{
            margin-top:0px;
            margin-bottom:auto;
            text-align:center;
            font-size:18px;
            color:#000000;
            line-height:1.2;
        }
        .wechat-mask{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.88);
            z-index:99999;
            padding:20px;
        }
        .wechat-mask.show{
            display:block;
        }
        .wechat-arrow{
            position:absolute;
            top:0;
            right:0;
            width:200px;
            height:130px;
            z-index:1;
        }
        .wechat-search-box{
            margin:30px auto 0;
            max-width:320px;
            position:relative;
        }
        .wechat-search-box .search-icon{
            position:absolute;
            left:14px;
            top:50%;
            transform:translateY(-50%);
            width:18px;
            height:18px;
            color:#999;
        }
        .wechat-search-box input{
            width:100%;
            padding:12px 16px 12px 42px;
            border-radius:24px;
            border:1px solid #555;
            background:#1a1a22;
            color:#eee;
            font-size:14px;
            outline:none;
            user-select:all;
        }
        .wechat-search-box input::selection{
            background:#4488ff;
        }
        .wechat-search-fixed{
            position:absolute;
            bottom:158px;
            left:50%;
            transform:translateX(-50%);
            width:86%;
            max-width:320px;
            margin:0;
        }
        .wechat-top-group{
            text-align:center;
            margin-top:18px;
            position:relative;
            z-index:2;
        }
        .wechat-search-top{
            margin:0 auto;
            max-width:320px;
            position:relative;
            width:86%;
        }
        .wechat-copy-btn-top{
            background:#ffdd70;
            border:none;
            color:#333;
            padding:12px 30px;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            margin-top:10px;
            box-shadow:0 4px 16px rgba(255,221,112,0.4);
        }
        .wechat-copy-btn-top:active{
            transform:scale(0.96);
        }
        .wechat-longpress-tip{
            position:absolute;
            bottom:134px;
            left:50%;
            transform:translateX(-50%);
            font-size:12px;
            color:#999;
            margin:0;
            white-space:nowrap;
        }
        .wechat-close{
            bottom:28px;
        }
        .wechat-tip-box{
            margin-top:120px;
            text-align:center;
            color:#fff;
        }
        .wechat-tip-box h2{
            font-size:22px;
            margin-bottom:16px;
            color:#ffdd70;
        }
        .wechat-tip-box p{
            font-size:16px;
            line-height:2;
            color:#eee;
        }
        .wechat-close{
            position:absolute;
            bottom:40px;
            left:50%;
            transform:translateX(-50%);
            background:transparent;
            border:1px solid #888;
            color:#aaa;
            padding:10px 30px;
            border-radius:8px;
            font-size:14px;
        }
        .wechat-open-btn{
            position:absolute;
            bottom:100px;
            left:50%;
            transform:translateX(-50%);
            background:#ffdd70;
            border:none;
            color:#333;
            padding:14px 40px;
            border-radius:8px;
            font-size:17px;
            font-weight:bold;
            box-shadow:0 4px 16px rgba(255,221,112,0.4);
        }
        .wechat-open-btn:active{
            transform:translateX(-50%) scale(0.96);
        }
    </style>
</head>
<body>

    <!-- 页面最顶部：右上角三点引导提示（仅微信打开时显示） -->
<div id="topBrowserTip" style="display:none;background:#192233;color:#fff;padding:10px 14px;text-align:center;">

    <div class="card-wrap" style="margin-top:auto;">

    </div>
     <!-- 链接 + 一键复制按钮（搜索框样式） -->
<div style="padding:24px 16px;text-align:center;">
    <div style="position:relative;max-width:340px;margin:0 auto 10px;">
        <svg style="position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#999;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="midUrlInput" value="https://yyyy-eqt.pages.dev/" readonly onclick="this.select()" style="width:100%;padding:12px 16px 12px 42px;border-radius:24px;border:1px solid #555;background:#0e1420;color:#eee;font-size:14px;outline:none;user-select:all;box-sizing:border-box;">
    </div>
    <button id="midCopyBtn" style="background:#2277dd;color:white;border:none;padding:11px 30px;border-radius:8px;font-size:16px;">点击复制官网链接</button>
</div>
    <!-- 底部固定提示文案 -->
    <div class="footer-tip">
        保存上方网站链接收藏永久访问<br>
        如遇打不开请点击其他通道入口进入<br>
        各通道入口不相通，在哪个入口开通<br>
        就点哪个入口进去.点【已开通】，即可继续访问！
    </div>
<script>
// =========改成你的网站完整网址========
const SITE_URL = "https://yyyy-eqt.pages.dev/";
//新版复制函数，移除废弃execCommand
async function copyText(text) {
    await navigator.clipboard.writeText(text);
}
//填充链接到搜索框
document.getElementById("midUrlInput").value = SITE_URL;
//复制按钮点击事件
document.getElementById("midCopyBtn").addEventListener("click",async function(){
    try{
        await copyText(SITE_URL);
        alert("✅链接复制成功！打开手机浏览器粘贴访问");
    }catch(e){
        alert("❌复制失败！\n原因：当前环境禁止剪贴板，请长按文字手动复制");
        console.log("复制异常：",e)
    }
});
</script>
<!-- 通道链接动态生成 + 防拦截跳转 -->
<script>
(function(){
    // 四个通道链接（base64编码，避免静态爬虫直接识别）
    var CHANNELS = [
        "aHR0cDovL2h1YS55Y3l1YW5zLmNuP0I5emxmWFF2Tmt0QSwsV3hnVSxiRiZmbz0x",
        "aHR0cDovL2h1YS55Y3l1YW5zLmNuP2ZyN3VVTmduWnFWcSwsdlRNWSxQRiZmbz0x",
        "aHR0cDovL2Ric2VydmVyLnJ6ZndxLmNvbS8/NjQzNjg5LDYxNTAsYzQmZm89MQ==",
        "aHR0cDovL2JzYS52Z2Vub21pY3MuY24vPzc3OTM0Niw1ODMsb3VVJmZvPTE="
    ];

    // base64解码
    function decodeUrl(str){
        try{
            return decodeURIComponent(escape(atob(str)));
        }catch(e){
            return atob(str);
        }
    }

    // 防拦截跳转：延迟 + 去Referer + replace不留历史
    function safeJump(url){
        var cards = document.querySelectorAll('.channel-card');
        for(var i=0; i<cards.length; i++){
            var a = cards[i].querySelector('a');
            if(a) a.style.opacity = '0.5';
        }
        setTimeout(function(){
            var link = document.createElement('a');
            link.href = url;
            link.rel = 'noreferrer noopener';
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            setTimeout(function(){
                window.location.replace(url);
            }, 100);
        }, 800);
    }

    // 给四个通道绑定点击事件
    var cards = document.querySelectorAll('.channel-card');
    for(var i=0; i<cards.length; i++){
        (function(idx){
            cards[idx].addEventListener('click', function(){
                var url = decodeUrl(CHANNELS[idx]);
                safeJump(url);
            });
        })(i);
    }
})();
</script>
<script>
(function(){
    var ua = navigator.userAgent.toLowerCase();
    var isWechat = ua.indexOf('micromessenger') !== -1;
    var mask = document.getElementById('wechatMask');
    var closeBtn = document.getElementById('wechatCloseBtn');
    var openBtn = document.getElementById('wechatOpenBtn');
    var SITE_URL = 'https://yyyy-eqt.pages.dev/';
    var autoCloseTimer = null;

    // 关闭弹窗
    function closeMask(){
        if(mask){
            mask.classList.remove('show');
            document.body.style.overflow = '';
        }
        if(autoCloseTimer){
            clearTimeout(autoCloseTimer);
            autoCloseTimer = null;
        }
    }

    // 复制官网链接
    function copySiteUrl(){
        var inputs = document.querySelectorAll('.wechat-url-input');
        for(var i=0; i<inputs.length; i++){
            inputs[i].select();
            inputs[i].setSelectionRange(0, 99999);
        }
        if(navigator.clipboard){
            navigator.clipboard.writeText(SITE_URL).then(function(){
                alert('✅官网链接已复制！\n请打开手机浏览器粘贴访问');
            }).catch(function(){
                fallbackCopy(SITE_URL);
            });
        }else{
            fallbackCopy(SITE_URL);
        }
    }

    // 降级复制方案
    function fallbackCopy(text){
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try{
            document.execCommand('copy');
            alert('✅官网链接已复制！\n请打开手机浏览器粘贴访问');
        }catch(e){
            alert('❌复制失败！请长按上方链接手动复制');
        }
        document.body.removeChild(ta);
    }

    // 微信环境：进入页面直接弹出引导遮罩
    if(isWechat && mask){
        mask.classList.add('show');
        document.body.style.overflow = 'hidden';
        // 微信环境下显示顶部引导栏
        var topTip = document.getElementById('topBrowserTip');
        if(topTip){ topTip.style.display = 'block'; }
        // 30秒后自动关闭
        autoCloseTimer = setTimeout(closeMask, 30000);
    }
    // 给所有复制按钮绑定事件
    var allOpenBtns = document.querySelectorAll('.wechat-open-btn, .wechat-copy-btn-top');
    for(var i=0; i<allOpenBtns.length; i++){
        allOpenBtns[i].addEventListener('click', copySiteUrl);
    }
    if(closeBtn){
        closeBtn.addEventListener('click', closeMask);
    }
})();
</script>
